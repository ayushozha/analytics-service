services:
  pulse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulse-analytics
    ports:
      - "8090:8090"
    environment:
      - PULSE_PORT=8090
      - ENVIRONMENT=development
      - DATABASE_URL=postgres://pulse:pulse@postgres:5432/pulse_analytics?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - REDIS_KEY_PREFIX=pulse_analytics:
      - PULSE_ADMIN_TOKEN=dev-admin-token
      - ALLOWED_ORIGINS=*
      - RUST_LOG=debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: pulse-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: pulse_analytics
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pulse-redis
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
