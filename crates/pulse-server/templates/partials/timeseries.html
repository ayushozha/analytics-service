<div class="bg-white rounded-xl border border-gray-200 p-6">
    <h3 class="text-sm font-medium text-gray-700 mb-4">Traffic over time</h3>
    <canvas id="timeseriesChart" height="80"></canvas>
    <div id="timeseries-data" class="hidden" data-chart='{{ chart_json }}'></div>
</div>
<script>
(function() {
    const dataEl = document.getElementById('timeseries-data');
    if (!dataEl) return;
    const data = JSON.parse(dataEl.getAttribute('data-chart'));
    const ctx = document.getElementById('timeseriesChart');
    if (!ctx) return;
    if (window._tsChart) window._tsChart.destroy();
    window._tsChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: data.map(d => d.date),
            datasets: [{
                label: 'Pageviews',
                data: data.map(d => d.pageviews),
                borderColor: '#6366f1',
                backgroundColor: 'rgba(99,102,241,0.1)',
                fill: true,
                tension: 0.3,
                pointRadius: 2,
            }, {
                label: 'Visitors',
                data: data.map(d => d.visitors),
                borderColor: '#8b5cf6',
                backgroundColor: 'rgba(139,92,246,0.05)',
                fill: true,
                tension: 0.3,
                pointRadius: 2,
            }]
        },
        options: {
            responsive: true,
            interaction: { intersect: false, mode: 'index' },
            plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 6 } } },
            scales: {
                x: { grid: { display: false }, ticks: { font: { size: 11 } } },
                y: { beginAtZero: true, grid: { color: '#f3f4f6' }, ticks: { font: { size: 11 } } }
            }
        }
    });
})();
</script>
