{% extends "base.html" %}
{% block title %}Login — Pulse Analytics{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center bg-gray-50">
    <div class="max-w-sm w-full bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-indigo-600">Pulse</h1>
            <p class="text-sm text-gray-500 mt-1">Enter your API key to view analytics</p>
        </div>
        {% if error.is_some() %}
        <div class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700">
            {{ error.as_deref().unwrap_or("") }}
        </div>
        {% endif %}
        <form action="/dashboard/login" method="post">
            <label for="api_key" class="block text-sm font-medium text-gray-700 mb-1.5">API Key</label>
            <input type="text" name="api_key" id="api_key" required
                placeholder="pa_live_..."
                class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            <button type="submit"
                class="mt-4 w-full bg-indigo-600 text-white text-sm font-medium py-2.5 rounded-lg hover:bg-indigo-700 transition-colors">
                Sign in
            </button>
        </form>
    </div>
</div>
{% endblock %}
