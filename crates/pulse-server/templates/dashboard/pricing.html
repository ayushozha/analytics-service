{% extends "base.html" %}
{% block title %}Pricing Analytics — Pulse Analytics{% endblock %}
{% block body %}
<div class="flex h-screen">
    {% include "partials/nav.html" %}
    <main class="flex-1 overflow-y-auto">
        <div class="p-6 max-w-7xl">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-bold text-gray-900">Pricing Analytics</h2>
                {% include "partials/date_picker.html" %}
            </div>

            <div id="pricing-stats"
                 hx-get="/dashboard/api/pricing/stats?start_at={{ start_at }}&end_at={{ end_at }}"
                 hx-trigger="load, dateChange"
                 data-date-target="true"
                 class="mb-6">
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                    {% for _ in 0..4 %}
                    <div class="bg-white rounded-xl border border-gray-200 p-4 animate-pulse">
                        <div class="h-3 bg-gray-200 rounded w-16 mb-2"></div>
                        <div class="h-6 bg-gray-200 rounded w-20"></div>
                    </div>
                    {% endfor %}
                </div>
            </div>

            <div id="pricing-timeseries"
                 hx-get="/dashboard/api/pricing/timeseries?start_at={{ start_at }}&end_at={{ end_at }}"
                 hx-trigger="load, dateChange"
                 data-date-target="true"
                 class="mb-6">
                <div class="bg-white rounded-xl border border-gray-200 p-6 animate-pulse">
                    <div class="h-3 bg-gray-200 rounded w-32 mb-4"></div>
                    <div class="h-48 bg-gray-100 rounded"></div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                <div id="pricing-frequency"
                     hx-get="/dashboard/api/pricing/frequency?start_at={{ start_at }}&end_at={{ end_at }}"
                     hx-trigger="load, dateChange"
                     data-date-target="true">
                    <div class="bg-white rounded-xl border border-gray-200 p-6 animate-pulse">
                        <div class="h-3 bg-gray-200 rounded w-32 mb-4"></div>
                        <div class="h-48 bg-gray-100 rounded"></div>
                    </div>
                </div>
                <div id="pricing-referrers"
                     hx-get="/dashboard/api/pricing/referrers?start_at={{ start_at }}&end_at={{ end_at }}"
                     hx-trigger="load, dateChange"
                     data-date-target="true">
                    <div class="bg-white rounded-xl border border-gray-200 p-6 animate-pulse">
                        <div class="h-3 bg-gray-200 rounded w-32 mb-4"></div>
                        <div class="h-48 bg-gray-100 rounded"></div>
                    </div>
                </div>
            </div>

            <div id="pricing-heatmap"
                 hx-get="/dashboard/api/pricing/heatmap?start_at={{ start_at }}&end_at={{ end_at }}"
                 hx-trigger="load, dateChange"
                 data-date-target="true"
                 class="mb-6">
                <div class="bg-white rounded-xl border border-gray-200 p-6 animate-pulse">
                    <div class="h-3 bg-gray-200 rounded w-32 mb-4"></div>
                    <div class="h-48 bg-gray-100 rounded"></div>
                </div>
            </div>

            <div id="pricing-funnel"
                 hx-get="/dashboard/api/pricing/funnel?start_at={{ start_at }}&end_at={{ end_at }}&steps=/,/pricing,/signup"
                 hx-trigger="load, dateChange"
                 data-date-target="true">
                <div class="bg-white rounded-xl border border-gray-200 p-6 animate-pulse">
                    <div class="h-3 bg-gray-200 rounded w-32 mb-4"></div>
                    <div class="h-48 bg-gray-100 rounded"></div>
                </div>
            </div>
        </div>
    </main>
</div>
{% endblock %}
