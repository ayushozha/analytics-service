{% extends "base.html" %}
{% block title %}Visitors — Pulse Analytics{% endblock %}
{% block body %}
<div class="flex h-screen">
    {% include "partials/nav.html" %}
    <main class="flex-1 overflow-y-auto">
        <div class="p-6 max-w-7xl">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-bold text-gray-900">Visitors</h2>
                <div class="flex items-center gap-4">
                    <div id="live-badge"
                         hx-get="/dashboard/api/visitors/live-count"
                         hx-trigger="load, every 5s">
                    </div>
                    {% include "partials/date_picker.html" %}
                </div>
            </div>

            <div class="mb-6">
                <h3 class="text-sm font-medium text-gray-700 mb-3">Recent Activity</h3>
                <div id="activity-feed"
                     hx-get="/dashboard/api/visitors/activity-feed"
                     hx-trigger="load, every 10s"
                     class="bg-white rounded-xl border border-gray-200 overflow-hidden">
                    <div class="p-8 text-center text-gray-400 animate-pulse">Loading...</div>
                </div>
            </div>

            <div class="mb-4">
                <input type="text" id="visitor-search" placeholder="Search by visitor ID..."
                    class="text-sm border border-gray-300 rounded-lg px-4 py-2 w-64 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                    hx-get="/dashboard/api/visitors/table?start_at={{ start_at }}&end_at={{ end_at }}"
                    hx-trigger="keyup changed delay:300ms"
                    hx-target="#visitors-table"
                    hx-include="this"
                    name="search">
            </div>

            <div id="visitors-table"
                 hx-get="/dashboard/api/visitors/table?start_at={{ start_at }}&end_at={{ end_at }}"
                 hx-trigger="load, dateChange"
                 data-date-target="true">
                <div class="bg-white rounded-xl border border-gray-200 p-8 text-center text-gray-400 animate-pulse">Loading...</div>
            </div>
        </div>
    </main>
</div>
{% endblock %}
