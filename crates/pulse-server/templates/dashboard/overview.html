{% extends "base.html" %}
{% block title %}Overview — Pulse Analytics{% endblock %}
{% block body %}
<div class="flex h-screen">
    {% include "partials/nav.html" %}
    <main class="flex-1 overflow-y-auto">
        <div class="p-6 max-w-6xl">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-bold text-gray-900">Overview</h2>
                {% include "partials/date_picker.html" %}
            </div>

            <div id="stats-cards"
                 hx-get="/dashboard/api/stats?start_at={{ start_at }}&end_at={{ end_at }}"
                 hx-trigger="load, dateChange"
                 hx-indicator=".htmx-indicator"
                 data-date-target="true"
                 class="mb-6">
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                    {% for _ in 0..4 %}
                    <div class="bg-white rounded-xl border border-gray-200 p-4 animate-pulse">
                        <div class="h-3 bg-gray-200 rounded w-16 mb-2"></div>
                        <div class="h-6 bg-gray-200 rounded w-20"></div>
                    </div>
                    {% endfor %}
                </div>
            </div>

            <div id="timeseries"
                 hx-get="/dashboard/api/timeseries?start_at={{ start_at }}&end_at={{ end_at }}"
                 hx-trigger="load, dateChange"
                 hx-indicator=".htmx-indicator"
                 data-date-target="true">
                <div class="bg-white rounded-xl border border-gray-200 p-6 animate-pulse">
                    <div class="h-3 bg-gray-200 rounded w-32 mb-4"></div>
                    <div class="h-48 bg-gray-100 rounded"></div>
                </div>
            </div>
        </div>
    </main>
</div>
{% endblock %}
